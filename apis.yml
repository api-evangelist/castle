aid: castle
name: Castle
description: >-
  Castle is a fraud and account-abuse prevention platform that stops bots,
  credential stuffing, account takeover, and multi-accounting through
  behavioral analysis and device fingerprinting — without CAPTCHAs or puzzles
  for legitimate users. Developers integrate a client-side SDK (browser and
  mobile) that generates a short-lived request token, then call Castle's
  backend Risk API and Filter API to score authentication and transaction
  events in real time. Castle returns machine-learning risk scores and signals
  (bot, proxy/VPN, residential proxy, impossible travel, device reputation)
  that drive a policy rules engine, Lists, and webhooks. It serves security and
  trust-and-safety teams across gaming, fintech, marketplaces, and SaaS.
