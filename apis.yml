apis:
- aid: castle:castle-api
  name: Castle API
  description: >-
    Castle's REST API for real-time fraud and abuse detection. The Risk API
    scores authenticated user events (login, transaction, profile update), the
    Filter API scores anonymous/pre-authentication events (registration,
    password reset), the Log API records events without scoring, and the
    enterprise Events API queries and aggregates historical events. Device and
    Lists endpoints manage device reputation and allow/deny lists.
